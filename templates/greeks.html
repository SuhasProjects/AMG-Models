{% extends 'base.html' %}
{% block content %}

<!-- Top Stats Bar -->
<div class="card" style="margin-bottom: 30px; padding: 25px 36px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 30px;">
        
        <div style="display: flex; gap: 30px; align-items: flex-end;">
            <div class="form-group" style="margin: 0; min-width: 140px;">
                <label>Underlying Spot</label>
                <input type="number" id="global_spot" style="font-weight: 600; color: var(--amg-navy); padding: 10px;" placeholder="0.00" onchange="triggerCalc()">
            </div>
            <div class="form-group" style="margin: 0; min-width: 180px;">
                <label>Days to Expiry (TTE): <span id="tteLabel" style="color: var(--amg-navy); font-size: 13px;">30</span></label>
                <input type="range" id="tteSlider" min="1" max="365" value="30" oninput="updateTteLabel(); triggerCalc()" style="padding: 0; border: none; height: 38px;">
            </div>
        </div>

        <div class="data-grid" style="margin: 0; grid-template-columns: repeat(6, 1fr); gap: 12px; flex-grow: 1;">
            <div class="data-item"><div class="data-label">Net Cost</div><div class="data-value" id="agg_cost">0.00</div></div>
            <div class="data-item"><div class="data-label">Delta</div><div class="data-value" id="agg_delta">0.00</div></div>
            <div class="data-item"><div class="data-label">Gamma</div><div class="data-value" id="agg_gamma">0.00</div></div>
            <div class="data-item"><div class="data-label">Theta</div><div class="data-value" id="agg_theta">0.00</div></div>
            <div class="data-item"><div class="data-label">Vega</div><div class="data-value" id="agg_vega">0.00</div></div>
            <div class="data-item"><div class="data-label">Rho</div><div class="data-value" id="agg_rho">0.00</div></div>
        </div>
        
    </div>
</div>

<!-- Chart Section -->
<div class="card" style="position: relative; padding: 20px 36px;">
    <div style="position: absolute; top: 30px; left: 36px; z-index: 10;">
        <select id="greekSelector" style="width: 140px; padding: 8px 12px; font-weight: 600; box-shadow: 0 4px 6px rgba(0,0,0,0.05);" onchange="drawChart()">
            <option value="delta">Delta</option>
            <option value="gamma">Gamma</option>
            <option value="vega">Vega</option>
            <option value="theta">Theta</option>
            <option value="rho">Rho</option>
        </select>
    </div>
    <div id="mainChart" style="height: 500px; width: 100%;"></div>
</div>

<!-- Bottom Inline Legs Table -->
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;">
        <h2 style="margin: 0;">Active Structure</h2>
        <button class="btn btn-primary" style="padding: 10px 20px;" onclick="addEmptyLeg()">+ Add Leg</button>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(6, 1fr) repeat(5, 0.8fr) 0.5fr; gap: 10px; border-bottom: 2px solid var(--border-gray); padding-bottom: 12px; margin-bottom: 15px;">
        <div class="data-label" style="margin:0;">Strike</div>
        <div class="data-label" style="margin:0;">Type</div>
        <div class="data-label" style="margin:0;">Position</div>
        <div class="data-label" style="margin:0;">Qty</div>
        <div class="data-label" style="margin:0;">Mult</div>
        <div class="data-label" style="margin:0;">Price</div>
        <div class="data-label" style="margin:0; text-align: right;">IV %</div>
        <div class="data-label" style="margin:0; text-align: right;">Theo</div>
        <div class="data-label" style="margin:0; text-align: right;">Delta</div>
        <div class="data-label" style="margin:0; text-align: right;">Gamma</div>
        <div class="data-label" style="margin:0; text-align: right;">Vega</div>
        <div></div>
    </div>
    
    <div id="activeLegsContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
</div>

<script>
let activeLegs = [];
let debounceTimer;
let currentChartData = null;
let currentLegData = [];

function updateTteLabel() { document.getElementById('tteLabel').innerText = document.getElementById('tteSlider').value; }

function addEmptyLeg() {
    const defaultSpot = document.getElementById('global_spot').value || 100;
    activeLegs.push({ position: 'long', option_type: 'call', K: parseFloat(defaultSpot), actual_price: 1.50, contracts: 1, multiplier: 100 });
    renderLegsInputs();
}

function updateLeg(index, field, value) { activeLegs[index][field] = value; triggerCalc(); }
function removeLeg(index) { activeLegs.splice(index, 1); triggerCalc(); }

function renderLegsInputs() {
    const container = document.getElementById('activeLegsContainer');
    if (activeLegs.length === 0) {
        container.innerHTML = '<div style="text-align: center; font-size: 12px; color: var(--text-muted); padding: 30px 0;">No positions added. Click + Add Leg to build a strategy.</div>';
        currentChartData = null; drawChart(); return;
    }

    let html = '';
    activeLegs.forEach((leg, i) => {
        const metrics = currentLegData[i] || { iv: 0, theor: 0, delta: 0, gamma: 0, vega: 0 };
        // We inject inline padding overrides so the table rows stay compact inside the grid
        html += `
        <div style="display: grid; grid-template-columns: repeat(6, 1fr) repeat(5, 0.8fr) 0.5fr; gap: 10px; align-items: center; border-bottom: 1px solid #f0f4f8; padding-bottom: 8px;">
            <div><input type="number" value="${leg.K}" onchange="updateLeg(${i}, 'K', this.value)" style="padding: 8px 10px; font-size: 13px;"></div>
            <div><select onchange="updateLeg(${i}, 'option_type', this.value)" style="padding: 8px 10px; font-size: 13px;"><option value="call" ${leg.option_type==='call'?'selected':''}>Call</option><option value="put" ${leg.option_type==='put'?'selected':''}>Put</option></select></div>
            <div><select style="padding: 8px 10px; font-size: 13px; font-weight: 600; color: ${leg.position==='long'?'#10b981':'#ef4444'};" onchange="updateLeg(${i}, 'position', this.value)"><option value="long" ${leg.position==='long'?'selected':''}>Long</option><option value="short" ${leg.position==='short'?'selected':''}>Short</option></select></div>
            <div><input type="number" value="${leg.contracts}" onchange="updateLeg(${i}, 'contracts', this.value)" style="padding: 8px 10px; font-size: 13px;"></div>
            <div><input type="number" value="${leg.multiplier}" onchange="updateLeg(${i}, 'multiplier', this.value)" style="padding: 8px 10px; font-size: 13px;"></div>
            <div><input type="number" value="${leg.actual_price}" step="any" onchange="updateLeg(${i}, 'actual_price', this.value)" style="padding: 8px 10px; font-size: 13px;"></div>
            
            <div style="text-align: right; font-size: 13px; color: var(--text-primary); font-weight: 500;">${metrics.iv.toFixed(2)}%</div>
            <div style="text-align: right; font-size: 13px; color: var(--text-primary); font-weight: 500;">${metrics.theor.toFixed(2)}</div>
            <div style="text-align: right; font-size: 13px; color: var(--text-primary); font-weight: 500;">${metrics.delta.toFixed(3)}</div>
            <div style="text-align: right; font-size: 13px; color: var(--text-primary); font-weight: 500;">${metrics.gamma.toFixed(3)}</div>
            <div style="text-align: right; font-size: 13px; color: var(--text-primary); font-weight: 500;">${metrics.vega.toFixed(3)}</div>
            
            <div style="text-align: right;"><button class="btn btn-danger" style="padding: 8px; width: 100%; min-width: 32px;" onclick="removeLeg(${i})">✕</button></div>
        </div>`;
    });
    container.innerHTML = html;
}

function triggerCalc() {
    renderLegsInputs();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(fetchGreeks, 250);
}

async function fetchGreeks() {
    if (activeLegs.length === 0) return;
    const spot = document.getElementById('global_spot').value || activeLegs[0].K;
    
    const payload = {
        spot_price: spot, tte_days: document.getElementById('tteSlider').value,
        legs: activeLegs.map(l => ({ ...l, asset_class: 'equity', r: 0.05, q: 0, volatility_method: 'implied' }))
    };

    const response = await fetch('/api/greeks', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
    const data = await response.json();
    
    currentChartData = data.chart;
    currentLegData = data.legs;
    
    document.getElementById('agg_cost').innerText = "$" + data.aggregates.cost.toFixed(2);
    document.getElementById('agg_delta').innerText = data.aggregates.delta.toFixed(3);
    document.getElementById('agg_gamma').innerText = data.aggregates.gamma.toFixed(3);
    document.getElementById('agg_theta').innerText = data.aggregates.theta.toFixed(3);
    document.getElementById('agg_vega').innerText = data.aggregates.vega.toFixed(3);
    document.getElementById('agg_rho').innerText = data.aggregates.rho.toFixed(3);
    
    renderLegsInputs();
    drawChart();
}

function drawChart() {
    if (!currentChartData) { Plotly.purge('mainChart'); return; }
    const spot = document.getElementById('global_spot').value || activeLegs[0].K;
    const greekName = document.getElementById('greekSelector').value;

    const traces = [
        // 1. Expiration Payoff (Intrinsic) - AMG Primary Blue[cite: 6]
        { 
            x: currentChartData.underlying, 
            y: currentChartData.payoff_exp, 
            type: 'scatter', 
            mode: 'lines', 
            name: 'Exp Payoff', 
            line: { color: 'rgb(31, 78, 120)', width: 2 }, 
            fill: 'tozeroy', 
            fillcolor: 'rgba(31, 78, 120, 0.08)' 
        },
        // 2. TTE Dynamic PnL (Extrinsic) - AMG Header Gray[cite: 6]
        { 
            x: currentChartData.underlying, 
            y: currentChartData.pnl_tte, 
            type: 'scatter', 
            mode: 'lines', 
            name: 'TTE PnL', 
            line: { color: 'rgb(117, 113, 113)', width: 2, dash: 'dot' } 
        },
        // 3. Selected Greek - AMG Secondary Blue[cite: 6]
        { 
            x: currentChartData.underlying, 
            y: currentChartData[greekName], 
            type: 'scatter', 
            mode: 'lines', 
            name: greekName.toUpperCase(), 
            yaxis: 'y2', 
            line: { color: 'rgb(87, 138, 205)', width: 2, dash: 'dash' } 
        }
    ];

    const layout = {
        plot_bgcolor: '#ffffff', paper_bgcolor: '#ffffff',
        font: { color: '#111', family: 'Montserrat, sans-serif' },
        margin: { t: 20, b: 40, l: 60, r: 60 },
        showlegend: false, hovermode: 'x unified',
        xaxis: { gridcolor: 'rgb(192, 192, 192)', zeroline: false }, // Subheader Gray[cite: 6]
        yaxis: { title: 'P&L ($)', gridcolor: 'rgb(192, 192, 192)', zerolinecolor: 'rgb(117, 113, 113)', zerolinewidth: 2, tickformat: '.2f' }, // Header Gray[cite: 6]
        yaxis2: { title: greekName.toUpperCase(), overlaying: 'y', side: 'right', showgrid: false, zeroline: false },
        shapes: [{ type: 'line', x0: spot, x1: spot, y0: 0, y1: 1, yref: 'paper', line: { color: 'rgb(117, 113, 113)', dash: 'dash', width: 1 } }]
    };

    Plotly.newPlot('mainChart', traces, layout, {responsive: true, displayModeBar: false});
}

addEmptyLeg();
</script>
{% endblock %}
