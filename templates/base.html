<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMG Options Engine</title>
    <!-- Bootstrap for structural grid support -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Official AMG Theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        /* Nav menu styles to perfectly blend into your old header */
        .nav-menu {
            display: flex;
            gap: 25px;
            margin-left: auto;
            list-style: none;
            margin-bottom: 0;
            align-items: center;
            padding-left: 0;
        }
        .nav-menu a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.2s ease;
        }
        .nav-menu a:hover {
            color: var(--amg-navy);
        }
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
        }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="brand-container" style="display: flex; width: 100%; align-items: center;">
            <img src="{{ url_for('static', filename='AMG Logo.jpeg') }}" alt="AMG Logo" class="amg-logo">
            <h1 class="header-title">Options Pricing Engine</h1>
            
            <ul class="nav-menu">
                <li><a href="/">Report Generator</a></li>
                <li><a href="/pnl">PnL Viewer</a></li>
                <li><a href="/greeks">Greek Sandbox</a></li>
                <li><a href="/methodology">Methodology</a></li>
            </ul>
        </div>
    </header>
    
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
